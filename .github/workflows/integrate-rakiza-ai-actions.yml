name: Integrate Rakiza AI Actions

on:
  push:
    branches:
      - rakiza-ai-actions-v0-1
    paths:
      - '.github/workflows/integrate-rakiza-ai-actions.yml'
      - 'rakiza-ai-actions.js'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rakiza-ai-actions-v0-1
          fetch-depth: 0

      - name: Integrate actions intelligence
        shell: python
        run: |
          from pathlib import Path

          # Natural-language coverage for action types, lifecycle, escalation, and subject matching.
          p=Path('rakiza-ai-actions.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("{key:'طلب دعم',aliases:['طلب دعم','دعم','دعم فني','مساندة']}","{key:'طلب دعم',aliases:['طلب دعم','طلبات الدعم','طلب الدعم','دعم','دعم فني','مساندة']}")
          s=s.replace("{key:'مشكلة عميل',aliases:['مشكلة عميل','مشكل عميل','شكوى عميل','شكوى','شكاوى العملاء']}","{key:'مشكلة عميل',aliases:['مشكلة عميل','مشكل عميل','مشاكل العملاء','مشاكل عميل','شكوى عميل','شكوى','شكاوى العملاء']}")
          s=s.replace("if(/طلب دعم|دعم فني|مشكله عميل|مشكلة عميل|شكوى عميل/.test(text))s+=5;","if(/طلبات?\\s*الدعم|طلب دعم|دعم فني|\\bدعم\\b|مشكله عميل|مشكلة عميل|مشاكل العملاء|مشاكل عميل|شكوى عميل|شكاوى العملاء/.test(text))s+=5;")
          anchor="if(/اغلق|أغلق|اقفل|مغلق|مقفول/.test(text)&&/طلب|اجراء|إجراء|صيانه|صيانة|دعم|شكوى/.test(text))s+=4;"
          extra="if(/(?:نتيجه|نتيجة).*(?:اغلاق|إغلاق)|(?:اغلاق|إغلاق).*(?:نتيجه|نتيجة)|نتيجه المعالجه|نتيجة المعالجة/.test(text))s+=5;"
          if extra not in s:
              if anchor not in s: raise SystemExit('actions result routing anchor not found')
              s=s.replace(anchor,extra+anchor,1)
          old="const n=norm(text),g=genericWords(),tokens=n.split(' ').filter(t=>t.length>=3&&!g.has(t));let best=null,score=0,tie=false;"
          new="const n=norm(text),g=genericWords(),raw=n.split(' ').filter(t=>t.length>=3&&!g.has(t)),tokens=[...new Set(raw.flatMap(t=>{const v=[t];if(t.startsWith('ال')&&t.length>4)v.push(t.slice(2));if(t.startsWith('لل')&&t.length>4)v.push(t.slice(2));return v}).filter(t=>t.length>=3&&!g.has(t)))];let best=null,score=0,tie=false;"
          if new not in s:
              if old not in s: raise SystemExit('actions focus token anchor not found')
              s=s.replace(old,new,1)
          s=s.replace("if(/كم مره.*تصعيد|كم مرة.*تصعيد|عدد مرات.*تصعيد|متى.*تصعيد|تاريخ.*تصعيد/.test(n))return'unsupported_escalation_history';","if(/كم مره.*(?:تصعيد|تصعد|تصعّد)|كم مرة.*(?:تصعيد|تصعد|تصعّد)|عدد مرات.*(?:تصعيد|تصعد|تصعّد)|متى.*(?:تصعيد|تصعد|تصعّد)|تاريخ.*(?:تصعيد|تصعد|تصعّد)/.test(n))return'unsupported_escalation_history';")
          s=s.replace("if(/سبب التصعيد|ليش تصعد|لماذا تصعد/.test(n))return'escalation_reason';","if(/سبب (?:التصعيد|تصعيد)|ليش تصعد|لماذا تصعد/.test(n))return'escalation_reason';")
          p.write_text(s,encoding='utf-8')

          # Load the actions specialist before shared reasoning.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="rakiza-ai-tasks.js"></script>\n<script src="rakiza-ai-reasoning.js"></script>'
          new='<script src="rakiza-ai-tasks.js"></script>\n<script src="rakiza-ai-actions.js"></script>\n<script src="rakiza-ai-reasoning.js"></script>'
          if new not in s:
              if old not in s:
                  raise SystemExit('index script anchor not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Extend shared reasoning with the Actions specialist without changing other domains.
          p=Path('rakiza-ai-reasoning.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if(/metric|score|count|sum|average|target|achievement|gap|variance|duration/.test(String(task)))return KNOWLEDGE_LEVELS.CALCULATION;",
                      "if(/metric|score|count|sum|average|target|achievement|gap|variance|duration|age/.test(String(task)))return KNOWLEDGE_LEVELS.CALCULATION;")

          anchor="  if(domain==='tasks'){out.push('اليوم المفتوح بلا حالة تنفيذ نهائية لا يُعامل كمهمة غير منفذة.');out.push('تعديل خطة اليوم لا يمحو النسخة السابقة، وأي تعديل معتمد يحتاج سببًا.');}\n"
          extra="  if(domain==='actions'){out.push('التصعيد يبقي الإجراء قيد المتابعة ولا يعني الإغلاق.');out.push('الإغلاق يحتاج نتيجة معالجة مسجلة.');out.push('سجل الإجراءات الحالي لا يحتفظ بتاريخ مستقل لكل تصعيد أو بعدد مرات التصعيد.');}\n"
          if extra not in s:
              if anchor not in s: raise SystemExit('reasoning constraints anchor not found')
              s=s.replace(anchor,anchor+extra,1)

          anchor="  if(domain==='tasks'){\n    if(s.employee&&!s.employee.ambiguous)return{type:'employee',id:s.employee.id||null,label:s.employee.full_name||s.employee.name||null};\n    if(s.category)return{type:'task_category',label:s.category};\n    if(s.section)return{type:'section',label:s.section.name||s.section};\n    if(s.execution)return{type:'execution_status',label:s.execution};\n  }\n"
          extra="  if(domain==='actions'){\n    if(s.focus)return{type:'action',id:s.focus.id||null,label:s.focus.subject||s.focus.action_type||'إجراء'};\n    if(s.type)return{type:'action_type',label:s.type};\n    if(s.status)return{type:'action_status',label:s.status};\n  }\n"
          if extra not in s:
              if anchor not in s: raise SystemExit('reasoning focus anchor not found')
              s=s.replace(anchor,anchor+extra,1)

          old="    tasks:['خطة اليوم المعتمدة والمهام والتكليفات وحالات التنفيذ عند الإغلاق']\n"
          new="    tasks:['خطة اليوم المعتمدة والمهام والتكليفات وحالات التنفيذ عند الإغلاق'],\n    actions:['سجل الإجراءات والمتابعات والحالة الحالية والتصعيد ونتيجة الإغلاق']\n"
          if "actions:['سجل الإجراءات والمتابعات" not in s:
              if old not in s: raise SystemExit('reasoning sources anchor not found')
              s=s.replace(old,new,1)

          old="    tasks:AI.tasks?.state?.last||null\n"
          new="    tasks:AI.tasks?.state?.last||null,\n    actions:AI.actions?.state?.last||null\n"
          if 'actions:AI.actions?.state?.last||null' not in s:
              if old not in s: raise SystemExit('reasoning snapshot anchor not found')
              s=s.replace(old,new,1)

          s=s.replace("for(const d of ['tasks','attendance','readiness','sales','shortages']){",
                      "for(const d of ['actions','tasks','attendance','readiness','sales','shortages']){")
          p.write_text(s,encoding='utf-8')

      - name: Syntax checks
        run: |
          node --check rakiza-ai.js
          node --check rakiza-ai-shortages.js
          node --check rakiza-ai-sales.js
          node --check rakiza-ai-readiness.js
          node --check rakiza-ai-attendance.js
          node --check rakiza-ai-tasks.js
          node --check rakiza-ai-actions.js
          node --check rakiza-ai-reasoning.js
          for f in tests/*.test.js; do node --check "$f"; done

      - name: Regression tests
        run: |
          node tests/rakiza-ai-shortages.test.js
          node tests/rakiza-ai-sales.test.js
          node tests/rakiza-ai-readiness.test.js
          node tests/rakiza-ai-attendance.test.js
          node tests/rakiza-ai-reasoning.test.js
          node tests/rakiza-ai-tasks.test.js
          node tests/rakiza-ai-tasks-reasoning.test.js
          node tests/rakiza-ai-actions.test.js
          node tests/rakiza-ai-actions-reasoning.test.js

      - name: Verify integration contract
        shell: python
        run: |
          from pathlib import Path
          a=Path('rakiza-ai-actions.js').read_text(encoding='utf-8')
          required=['escalationReason','closureResult','unsupported_escalation_history','unsupported_overdue','تم التصعيد — قيد المتابعة','نتيجة معالجة','لا يوجد SLA']
          missing=[x for x in required if x not in a]
          if missing: raise SystemExit('Missing actions contract: '+', '.join(missing))
          r=Path('rakiza-ai-reasoning.js').read_text(encoding='utf-8')
          required_reasoning=["actions:['سجل الإجراءات والمتابعات",'actions:AI.actions?.state?.last',"['actions','tasks','attendance'", "if(domain==='actions')"]
          missing=[x for x in required_reasoning if x not in r]
          if missing: raise SystemExit('Missing reasoning actions integration: '+', '.join(missing))
          i=Path('index.html').read_text(encoding='utf-8')
          order=['rakiza-ai-tasks.js','rakiza-ai-actions.js','rakiza-ai-reasoning.js']
          pos=[i.index(x) for x in order]
          if pos!=sorted(pos): raise SystemExit('Unexpected actions/reasoning script order')

      - name: Commit integrated actions intelligence
        run: |
          rm -f .github/workflows/integrate-rakiza-ai-actions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Rakiza AI actions intelligence v0.1'
          git push origin HEAD:rakiza-ai-actions-v0-1
