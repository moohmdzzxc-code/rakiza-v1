name: Enable split actions interface
on:
  push:
    paths:
      - '.github/workflows/enable-actions-split.yml'
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable actions split script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<script src="actions-split.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s)
          PY
      - name: Syntax check
        run: node --check actions-split.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable split actions interface"
          git push
# trigger
