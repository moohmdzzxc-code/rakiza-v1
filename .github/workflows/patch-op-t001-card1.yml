name: Persist approved OP-T001 card 1
on:
  push:
    paths:
      - '.github/workflows/patch-op-t001-card1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist card 1 on Next
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          delete_const = "const DELETE_API=SUPABASE_URL+'/functions/v1/rakiza-candidate-roster-change-delete';\n"
          card1_const = "const CARD1_SAVE_API=SUPABASE_URL+'/functions/v1/rakiza-candidate-card1-save';\n"
          if card1_const not in s:
              if delete_const not in s:
                  raise SystemExit('DELETE_API marker not found')
              s = s.replace(delete_const, delete_const + card1_const, 1)

          start = s.find('async function saveOpeningCard1AndNext(){')
          end = s.find('function ostep(', start)
          if start < 0 or end < 0:
              raise SystemExit('card 1 save function boundaries not found')

          new_code = r'''async function persistOpeningCard1(workDate,openingBy,monthlyTarget,dailyTarget){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('انتهت الجلسة. سجل الدخول من جديد');let r=await fetch(CARD1_SAVE_API,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY},body:JSON.stringify({work_date:workDate,opening_by_employee_id:openingBy,monthly_target:monthlyTarget,daily_target:dailyTarget})}),t=await r.text(),j;try{j=JSON.parse(t)}catch{throw Error('استجابة حفظ البطاقة الأولى غير صالحة')}if(r.status===401){await sb.auth.signOut();throw Error('انتهت الجلسة. سجل الدخول من جديد')}if(!r.ok)throw Error(j.error||'تعذر حفظ البطاقة الأولى');return j}async function saveOpeningCard1AndNext(){try{let d=$('wd').value,monthly=$('monthlyTarget').value.trim(),daily=$('dailyTarget').value.trim(),openingBy=$('openingBy').value,monthlyNum=Number(monthly.replace(/,/g,'')),dailyNum=Number(daily.replace(/,/g,''));if(!d)throw Error('حدد التاريخ');if(!openingBy)throw Error('حدد القائم على الافتتاح');if(!monthly||Number.isNaN(monthlyNum)||monthlyNum<0)throw Error('أدخل مستهدف الشهر بشكل صحيح');if(!daily||Number.isNaN(dailyNum)||dailyNum<0)throw Error('أدخل مستهدف اليوم بشكل صحيح');if(app.day&&d!==app.date)throw Error('لا يمكن تغيير التاريخ بعد بدء يوم التشغيل');if(!app.day){let r=await api('start-day',{method:'POST',body:{workDate:d,dayName:todayName(d)}});if(r.closed)throw Error('تم إغلاق يوم التشغيل لهذا التاريخ')}await persistOpeningCard1(d,openingBy,monthlyNum,dailyNum);await refresh();renderOpening();ostep(2)}catch(e){alert(e.message)}}'''
          s = s[:start] + new_code + s[end:]

          required = [
              "const CARD1_SAVE_API=SUPABASE_URL+'/functions/v1/rakiza-candidate-card1-save';",
              'async function persistOpeningCard1(',
              'await persistOpeningCard1(d,openingBy,monthlyNum,dailyNum);',
              'id="salesBefore" readonly',
              'id="wd" type="date"'
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit(f'missing card-1 persistence marker: {needle}')

          card1 = s[s.find('<div id="o1"'):s.find('<div id="o2"')]
          for forbidden in ['id="targetToDate"', 'id="approvedAt"', 'إدخال أولي']:
              if forbidden in card1:
                  raise SystemExit(f'unapproved card-1 marker present: {forbidden}')

          p.write_text(s, encoding='utf-8')

      - name: Syntax and scope checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<div id="o2"' in s and '<div id="o3"' in s and '<div id="o4"' in s and '<div id="o5"' in s
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline=[b for b in blocks if b.strip()]
          if not inline:
              raise SystemExit('inline script not found')
          Path('/tmp/rakiza-inline.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/rakiza-inline.js

      - name: Commit card 1 persistence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git diff -- index.html
          git add -- index.html
          git commit -m "Persist approved OP-T001 card 1 [skip ci]"
          git push
