name: Apply shortage supply follow-up
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-shortage-supply-followup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/patch_shortage_supply_followup.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add shortage supply follow-up"
          git push origin main
