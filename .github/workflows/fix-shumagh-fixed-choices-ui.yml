name: Fix Shumagh fixed choices UI
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_shumagh_fixed_choices_ui.py'
      - '.github/workflows/fix-shumagh-fixed-choices-ui.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/fix_shumagh_fixed_choices_ui.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish fixed Shumagh choices UI"
          git push origin main
