name: Apply Shumagh fixed choices
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_shumagh_fixed_choices.py'
      - '.github/workflows/apply-shumagh-fixed-choices.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/patch_shumagh_fixed_choices.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Show fixed Shumagh sizes and choices"
          git push origin main
