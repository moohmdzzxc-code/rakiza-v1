name: Fix shortage order tail
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shortage-order-tail.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/fix_shortage_order_tail.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix shortage order flow tail"
          git push origin main
