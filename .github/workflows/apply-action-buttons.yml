name: Apply action escalation and close controls
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-action-buttons.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/patch_action_buttons.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add action escalation and close controls [skip ci]"
          git push origin main
