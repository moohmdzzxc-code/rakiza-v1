name: Fix monthly target OCR text fallback
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-target-text-fallback.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add text fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('monthly-targets.js')
          s=p.read_text()
          marker='function mergeTargetMaps(dest,src){'
          if 'function parseOcrTextFallback(text){' not in s:
              fallback=r'''function parseOcrTextFallback(text){
  const month=activeMonth(),dmap=dateMaps(month),found=new Map();
  for(const raw of String(text||'').split(/\r?\n/)){
    let line=arabicDigits(raw).replace(/[−–—]/g,'-').replace(/(\d)\s+(\d)(?=\s*\/)/g,'$1$2').replace(/\s*\/\s*/g,'/').replace(/\s+/g,' ').trim();
    const dm=line.match(/\b(\d{1,2}\/\d{1,2}\/\d{2,4})\b/);if(!dm)continue;
    const date=parseDisplayDate(dm[1],month,dmap);if(!date)continue;
    const rest=line.slice((dm.index||0)+dm[0].length);
    const vals=(rest.match(/-?\d[\d,]*(?:\.\d+)?/g)||[]).map(ocrStrictNum).filter(v=>v!==null);
    if(vals.length<2)continue;
    let basic=null,challenge=null;
    if(vals.length>=3&&vals[1]>=0&&vals[2]>=0)basic=vals[2];
    else if(vals[1]>=0)basic=vals[1];
    if(basic===null)continue;
    if(vals.length>=5){
      const actual=(vals.length>=3&&vals[1]>=0&&vals[2]>=0)?vals[1]:null;
      if(actual!==null){
        for(let i=3;i<vals.length-1;i++){
          const c=vals[i];if(c<=0)continue;
          for(let j=i+1;j<vals.length;j++)if(Math.abs((actual-c)-vals[j])<=2){challenge=c;break}
          if(challenge!==null)break;
        }
      }else{
        for(let i=2;i<vals.length-1;i++)if(vals[i]>0&&Math.abs(vals[i]+vals[i+1])<=2){challenge=vals[i];break}
      }
    }
    found.set(date,{basic_target:basic,challenge_target:challenge,_basic_conf:1,_challenge_conf:challenge===null?0:1});
  }
  return found;
}
'''
              s=s.replace(marker,fallback+marker)
          old="const result=await worker.recognize(files[i],{},{text:true,tsv:true}),found=parseOcrTsv(result.data?.tsv||'');mergeTargetMaps(combined,found)"
          new="const result=await worker.recognize(files[i],{},{text:true,tsv:true}),found=parseOcrTsv(result.data?.tsv||'');if(!found.size)mergeTargetMaps(found,parseOcrTextFallback(result.data?.text||''));mergeTargetMaps(combined,found)"
          if old not in s:
              raise SystemExit('OCR recognize pattern not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Syntax check
        run: node --check monthly-targets.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly-targets.js
          git diff --cached --quiet || git commit -m "Add mobile OCR text fallback for targets"
          git push