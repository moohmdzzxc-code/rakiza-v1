name: Apply shortage Excel integration
on:
  push:
    branches: [main]
    paths:
      - 'scripts/link_shortages_excel_export.py'
      - '.github/workflows/apply-shortages-excel-link.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/link_shortages_excel_export.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip()]
          assert inline, 'inline app script not found'
          Path('/tmp/rakiza.js').write_text(inline[-1],encoding='utf-8')
          assert 'exceljs.min.js' in s
          assert 'exportShortagesExcel' in s
          assert 'shortages-excel-linked-2026-08-26' in s
          PY
          node --check /tmp/rakiza.js
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Link shortage flow to Excel export"
          git push
