name: Fix Rakiza roster trigger v1
on:
  push:
    branches: [main]
    paths:
      - 'tmp_fix_roster_trigger_v1.py'
      - '.github/workflows/tmp-fix-roster-trigger-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 tmp_fix_roster_trigger_v1.py
      - name: Syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/rakiza-inline.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)),encoding='utf-8')
          PY
          node --check /tmp/rakiza-inline.js
      - name: Commit
        run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix natural roster instruction trigger"
          git push
