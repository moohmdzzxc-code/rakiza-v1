name: Install Rakiza AI Attendance

on:
  push:
    paths:
      - '.github/workflows/install-rakiza-ai-attendance.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build attendance intelligence files
        run: |
          base64 -d .rakiza-attendance.b64 | gzip -d > rakiza-ai-attendance.js
          mkdir -p tests
          base64 -d .rakiza-attendance-test.b64 | gzip -d > tests/rakiza-ai-attendance.test.js
          sed -i "s#require('./rakiza-ai-attendance.js')#require('../rakiza-ai-attendance.js')#" tests/rakiza-ai-attendance.test.js

      - name: Link attendance intelligence into Rakiza
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="rakiza-ai-attendance.js"></script>'
          if tag not in s:
              anchor='<script src="rakiza-ai-readiness.js"></script>'
              if anchor not in s:
                  raise SystemExit('Rakiza AI readiness script anchor not found')
              s=s.replace(anchor,anchor+'\n'+tag,1)
          p.write_text(s,encoding='utf-8')

      - name: Syntax checks
        run: |
          node --check rakiza-ai.js
          node --check rakiza-ai-shortages.js
          node --check rakiza-ai-sales.js
          node --check rakiza-ai-readiness.js
          node --check rakiza-ai-attendance.js
          node --check tests/rakiza-ai-shortages.test.js
          node --check tests/rakiza-ai-sales.test.js
          node --check tests/rakiza-ai-readiness.test.js
          node --check tests/rakiza-ai-attendance.test.js

      - name: Regression tests
        run: |
          node tests/rakiza-ai-shortages.test.js
          node tests/rakiza-ai-sales.test.js
          node tests/rakiza-ai-readiness.test.js
          node tests/rakiza-ai-attendance.test.js

      - name: Commit attendance intelligence
        run: |
          rm -f .rakiza-attendance.b64 .rakiza-attendance-test.b64
          rm -f .github/workflows/install-rakiza-ai-attendance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Rakiza AI attendance and roster intelligence v0.1'
          git push origin HEAD:main
