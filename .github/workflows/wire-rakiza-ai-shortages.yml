name: Wire Rakiza AI Shortages Adapter

on:
  push:
    paths:
      - '.github/workflows/wire-rakiza-ai-shortages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate shortages adapter syntax
        run: node --check rakiza-ai-shortages.js

      - name: Wire adapter into index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          base = '<script src="rakiza-ai.js"></script>'
          addon = '<script src="rakiza-ai-shortages.js"></script>'
          if addon not in s:
              if base not in s:
                  raise SystemExit('rakiza-ai.js include not found')
              s = s.replace(base, base + '\n' + addon, 1)
              p.write_text(s, encoding='utf-8')
          if s.count(addon) != 1:
              raise SystemExit(f'Expected exactly one shortages adapter include, got {s.count(addon)}')

      - name: Validate integration
        run: |
          grep -F '<script src="rakiza-ai.js"></script>' index.html
          grep -F '<script src="rakiza-ai-shortages.js"></script>' index.html
          if grep -Eqi 'openai|rakiza-ai-assistant' rakiza-ai-shortages.js; then
            echo 'Unexpected external AI reference in shortages adapter'
            exit 1
          fi

      - name: Commit integration and remove temporary workflow
        run: |
          rm -f .github/workflows/wire-rakiza-ai-shortages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/wire-rakiza-ai-shortages.yml
          git commit -m 'Integrate Rakiza AI shortages intelligence'
          git push origin HEAD:main
