name: Fix shortage Excel blank quantities
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_shortage_excel_blank_qty.py'
      - '.github/workflows/fix-shortage-excel-blank-qty.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_shortage_excel_blank_qty.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip()]
          Path('/tmp/rakiza.js').write_text(inline[-1],encoding='utf-8')
          assert "return m.length?m.reduce" in s
          PY
          node --check /tmp/rakiza.js
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Keep unused shortage Excel quantities blank"
          git push
