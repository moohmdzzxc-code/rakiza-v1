name: Apply V1 team and day plan separation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-separate-team-dayplan-main.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/patch_separate_team_plan.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Separate team and day plan from V1 opening [skip ci]"
          git push origin main
