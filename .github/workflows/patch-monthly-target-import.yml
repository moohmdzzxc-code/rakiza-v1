name: Enable monthly target import
on:
  push:
    paths:
      - '.github/workflows/patch-monthly-target-import.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<script src="monthly-targets.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no closing body tag')
              s = s.replace('</body>', tag + '\n</body>', 1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable monthly target import in opening"
          git push