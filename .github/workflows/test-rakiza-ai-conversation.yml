name: Test Rakiza AI Conversation

on:
  push:
    branches:
      - rakiza-ai-conversation-v1-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Rakiza AI
        run: |
          set -e
          for f in rakiza-ai*.js; do node --check "$f"; done
          for f in tests/*.test.js; do node --check "$f"; done
      - name: Run complete Rakiza AI regression
        run: |
          set -e
          # Full suite: specialist brains + shared reasoning + store intelligence + conversation.
          for f in tests/*.test.js; do
            echo "=== $f ==="
            node "$f"
          done
