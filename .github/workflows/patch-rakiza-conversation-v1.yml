name: Patch Rakiza AI Conversation V1

on:
  push:
    branches:
      - rakiza-ai-conversation-v1-build

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch Rakiza Arabic possessive leave phrases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Arabic possessive leave language
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rakiza-ai-conversation.js')
          s=p.read_text()
          old="offCue=/اجازه|اجازة|اوف|راحه|راحة|سنويه|سنوية|سكليف|مرضي|مرضية|تعويضي/.test(s)"
          new="offCue=/اجازه|اجازة|اجازته|اجازتها|اجازتهم|اجازتي|اوف|راحه|راحة|راحته|راحتها|سنويه|سنوية|سنويته|سكليف|مرضي|مرضية|مرضيته|تعويضي/.test(s)"
          if old not in s: raise SystemExit('offCue target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rakiza-ai-conversation.js
          git commit -m "Expand Rakiza Arabic leave inflections"
          git push
