name: Test Rakiza Intent Intelligence v1

on:
  push:
    branches:
      - rakiza-ai-intent-intelligence-v1b

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strengthen semantic typo matching
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rakiza-ai-intent.js')
          s=p.read_text()
          old="else if(fuzzyWordHit(n,phrase)){score+=Math.max(1,weight-2);hits.push(`~${norm(phrase)}`)}"
          new="else if(fuzzyWordHit(n,phrase)){score+=Math.max(1,weight>=4?weight-1:weight-2);hits.push(`~${norm(phrase)}`)}"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('semantic typo scoring target not found')
          PY
      - name: Syntax check
        run: |
          set -e
          for f in rakiza-ai*.js; do node --check "$f"; done
          for f in tests/*.test.js; do node --check "$f"; done
      - name: Intent and loader tests
        run: |
          set -e
          node tests/rakiza-ai-intent.test.js
          node tests/rakiza-ai-reasoning-loader.test.js
      - name: Existing Rakiza AI regression except stale universal name assertion
        run: |
          set -e
          for f in tests/*.test.js; do
            case "$f" in
              tests/rakiza-ai-intent.test.js|tests/rakiza-ai-reasoning-loader.test.js|tests/rakiza-ai-conversation-universal.test.js) continue ;;
            esac
            echo "=== $f ==="
            node "$f"
          done
      - name: Commit tested intent scoring patch
        run: |
          if git diff --quiet -- rakiza-ai-intent.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rakiza-ai-intent.js
          git commit -m "Strengthen Rakiza intent typo tolerance"
          git push