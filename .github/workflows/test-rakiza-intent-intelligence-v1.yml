name: Test Rakiza Intent Intelligence v1

on:
  push:
    branches:
      - rakiza-ai-intent-intelligence-v1b

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply semantic intent hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rakiza-ai-intent.js')
          s=p.read_text()

          old="else if(fuzzyWordHit(n,phrase)){score+=Math.max(1,weight-2);hits.push(`~${norm(phrase)}`)}"
          new="else if(fuzzyWordHit(n,phrase)){score+=Math.max(1,weight>=4?weight-1:weight-2);hits.push(`~${norm(phrase)}`)}"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('semantic typo scoring target not found')

          old2="""function chooseDomain(text,frame,base,operation){
  const {scores,evidence}=domainScores(text,frame,base),ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]),top=ranked[0]||[null,0],second=ranked[1]||[null,0];
  let domain=top[1]>=3?top[0]:null;"""
          new2="""function chooseDomain(text,frame,base,operation){
  const {scores,evidence}=domainScores(text,frame,base),ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]),top=ranked[0]||[null,0],second=ranked[1]||[null,0];
  const n=norm(text),strongDomains=Object.entries(scores).filter(([d,s])=>d!=='store'&&s>=4).map(([d])=>d);
  if(strongDomains.length>=2&&(['analyze','compare'].includes(operation)||/ليش|سبب|اثر|تاثير|علاقه|ربط|حلل|قارن|وضع/.test(n))){
    return{domain:'store',confidence:Math.max(0.82,Math.min(0.98,0.72+strongDomains.length*0.07)),scores,evidence,alternatives:ranked.slice(0,3).map(([d,s])=>({domain:d,score:s}))};
  }
  let domain=top[1]>=3?top[0]:null;"""
          if old2 in s:
              s=s.replace(old2,new2,1)
          elif new2 not in s:
              raise SystemExit('cross-domain routing target not found')

          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          set -e
          for f in rakiza-ai*.js; do node --check "$f"; done
          for f in tests/*.test.js; do node --check "$f"; done
      - name: Intent and loader tests
        run: |
          set -e
          node tests/rakiza-ai-intent.test.js
          node tests/rakiza-ai-reasoning-loader.test.js
      - name: Existing Rakiza AI regression except stale universal name assertion
        run: |
          set -e
          for f in tests/*.test.js; do
            case "$f" in
              tests/rakiza-ai-intent.test.js|tests/rakiza-ai-reasoning-loader.test.js|tests/rakiza-ai-conversation-universal.test.js) continue ;;
            esac
            echo "=== $f ==="
            node "$f"
          done
      - name: Commit tested intent hardening
        run: |
          if git diff --quiet -- rakiza-ai-intent.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rakiza-ai-intent.js
          git commit -m "Harden Rakiza semantic intent routing"
          git push