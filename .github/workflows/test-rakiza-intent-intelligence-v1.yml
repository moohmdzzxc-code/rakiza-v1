name: Test Rakiza Intent Intelligence v1

on:
  push:
    branches:
      - rakiza-ai-intent-intelligence-v1b

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          set -e
          for f in rakiza-ai*.js; do node --check "$f"; done
          for f in tests/*.test.js; do node --check "$f"; done
      - name: Run Rakiza AI regression
        run: |
          set -e
          for f in tests/*.test.js; do
            echo "=== $f ==="
            node "$f"
          done
