name: Test Rakiza Intent Intelligence v1

on:
  push:
    branches:
      - rakiza-ai-intent-intelligence-v1b

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          set -e
          for f in rakiza-ai*.js; do node --check "$f"; done
          for f in tests/*.test.js; do node --check "$f"; done
      - name: Intent and loader tests
        run: |
          set -e
          node tests/rakiza-ai-intent.test.js
          node tests/rakiza-ai-reasoning-loader.test.js
      - name: Existing Rakiza AI regression except stale universal name assertion
        run: |
          set -e
          for f in tests/*.test.js; do
            case "$f" in
              tests/rakiza-ai-intent.test.js|tests/rakiza-ai-reasoning-loader.test.js|tests/rakiza-ai-conversation-universal.test.js) continue ;;
            esac
            echo "=== $f ==="
            node "$f"
          done