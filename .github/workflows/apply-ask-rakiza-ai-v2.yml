name: Apply Ask Rakiza AI v2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_ask_rakiza_ai_v2.py'
      - '.github/workflows/apply-ask-rakiza-ai-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/upgrade_ask_rakiza_ai_v2.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'ask-rakiza-ai-v2-2026-09-11' in s
          assert 'rakiza-ai-assistant' in s
          assert 'async function askRakizaAssistant(){' in s
          assert 'async function askRakizaAssistantLegacy(){' in s
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip()]
          Path('/tmp/rakiza.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/rakiza.js
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Upgrade Ask Rakiza to AI tool router v2"
          git push
