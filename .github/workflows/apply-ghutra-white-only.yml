name: Apply Ghutra white only
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_ghutra_white_only.py'
      - '.github/workflows/apply-ghutra-white-only.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/fix_ghutra_white_only.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make Ghutra white only"
          git push origin main
