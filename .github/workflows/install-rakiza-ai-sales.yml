name: Install Rakiza AI Sales

on:
  push:
    paths:
      - '.github/workflows/install-rakiza-ai-sales.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build sales intelligence files
        run: |
          cat .rakiza-sales-part1 .rakiza-sales-part2 .rakiza-sales-part3 .rakiza-sales-part4 | base64 -d | gzip -d > rakiza-ai-sales.js
          mkdir -p tests
          cat .rakiza-sales-test-part1 .rakiza-sales-test-part2 | base64 -d | gzip -d > tests/rakiza-ai-sales.test.js
          sed -i "s#require('./rakiza-ai-sales.js')#require('../rakiza-ai-sales.js')#" tests/rakiza-ai-sales.test.js

      - name: Link sales intelligence into Rakiza
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="rakiza-ai-sales.js"></script>'
          if tag not in s:
              anchor='<script src="rakiza-ai-shortages.js"></script>'
              if anchor not in s:
                  raise SystemExit('Rakiza AI shortages script anchor not found')
              s=s.replace(anchor,anchor+'\n'+tag,1)
          p.write_text(s,encoding='utf-8')

      - name: Syntax checks
        run: |
          node --check rakiza-ai-sales.js
          node --check tests/rakiza-ai-sales.test.js
          node --check rakiza-ai-shortages.js
          node --check tests/rakiza-ai-shortages.test.js

      - name: Regression tests
        run: |
          node tests/rakiza-ai-shortages.test.js
          node tests/rakiza-ai-sales.test.js

      - name: Commit sales intelligence
        run: |
          rm -f .rakiza-ai-sales-probe
          rm -f .rakiza-sales-part1 .rakiza-sales-part2 .rakiza-sales-part3 .rakiza-sales-part4
          rm -f .rakiza-sales-test-part1 .rakiza-sales-test-part2
          rm -f .github/workflows/install-rakiza-ai-sales.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Rakiza AI sales intelligence v0.1'
          git push origin HEAD:main
