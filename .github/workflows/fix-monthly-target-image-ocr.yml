name: Fix monthly target image OCR
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-target-image-ocr.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch image target reader
        run: |
          python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('' )).decode())"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly-targets.js
          git diff --cached --quiet || git commit -m "Fix Power BI image target extraction"
          git push
