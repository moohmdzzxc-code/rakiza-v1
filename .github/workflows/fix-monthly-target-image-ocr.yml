name: Fix monthly target image OCR
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-target-image-ocr.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch OCR fallback
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Syntax check
        run: node --check monthly-targets.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly-targets.js
          git diff --cached --quiet || git commit -m "Add mobile OCR text fallback for targets"
          git push