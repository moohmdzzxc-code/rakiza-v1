name: Integrate Rakiza AI Tasks

on:
  push:
    paths:
      - '.github/workflows/install-rakiza-ai-tasks.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply tasks intelligence integration
        run: python scripts/integrate-rakiza-ai-tasks.py

      - name: Improve noncompletion language routing
        shell: python
        run: |
          from pathlib import Path
          p=Path('rakiza-ai-tasks.js')
          s=p.read_text(encoding='utf-8')
          anchor="if(/مهام اليوم|مهامنا|المهام|مهمه اليوم|مهمة اليوم/.test(n))s+=5;"
          extra="if(/(?:مهمه|مهمة).*(?:ما اكتملت|لم تكتمل|لم تنفذ|ما تنفذت|تعثر)/.test(n))s+=5;"
          if extra not in s:
              if anchor not in s:
                  raise SystemExit('taskScore anchor not found')
              s=s.replace(anchor,anchor+extra,1)
          p.write_text(s,encoding='utf-8')

      - name: Improve responsibility language normalization
        shell: python
        run: |
          from pathlib import Path
          p=Path('rakiza-ai-tasks.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/مسؤول عن|مين ماسك|مكلف ب|تكليف/', '/مسوول عن|مسؤول عن|مين ماسك|مكلف ب|تكليف/')
          s=s.replace('/مين مسؤول|مين ماسك|مكلف|مسؤول عن/', '/مين مسوول|مين مسؤول|مين ماسك|مكلف|مسوول عن|مسؤول عن/')
          p.write_text(s,encoding='utf-8')

      - name: Syntax checks
        run: |
          node --check rakiza-ai.js
          node --check rakiza-ai-shortages.js
          node --check rakiza-ai-sales.js
          node --check rakiza-ai-readiness.js
          node --check rakiza-ai-attendance.js
          node --check rakiza-ai-tasks.js
          node --check rakiza-ai-reasoning.js
          node --check tests/rakiza-ai-shortages.test.js
          node --check tests/rakiza-ai-sales.test.js
          node --check tests/rakiza-ai-readiness.test.js
          node --check tests/rakiza-ai-attendance.test.js
          node --check tests/rakiza-ai-reasoning.test.js
          node --check tests/rakiza-ai-tasks.test.js
          node --check tests/rakiza-ai-tasks-reasoning.test.js

      - name: Regression tests
        run: |
          node tests/rakiza-ai-shortages.test.js
          node tests/rakiza-ai-sales.test.js
          node tests/rakiza-ai-readiness.test.js
          node tests/rakiza-ai-attendance.test.js
          node tests/rakiza-ai-reasoning.test.js
          node tests/rakiza-ai-tasks.test.js
          node tests/rakiza-ai-tasks-reasoning.test.js

      - name: Verify integration contract
        shell: python
        run: |
          from pathlib import Path
          t=Path('rakiza-ai-tasks.js').read_text(encoding='utf-8')
          required=['openExecutionNote','rankNoncompletionHtml','rankAssignmentsHtml','plan_changes','unsupported_rate','execution_final','change_draft']
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit('Missing tasks contract: '+', '.join(missing))
          r=Path('rakiza-ai-reasoning.js').read_text(encoding='utf-8')
          required_reasoning=['task_execution_open_not_failure',"tasks:['خطة اليوم المعتمدة",'tasks:AI.tasks?.state?.last']
          missing=[x for x in required_reasoning if x not in r]
          if missing:
              raise SystemExit('Missing reasoning tasks integration: '+', '.join(missing))
          i=Path('index.html').read_text(encoding='utf-8')
          order=['rakiza-ai-attendance.js','rakiza-ai-tasks.js','rakiza-ai-reasoning.js']
          pos=[i.index(x) for x in order]
          if pos!=sorted(pos):
              raise SystemExit('Unexpected tasks/reasoning script order')

      - name: Commit tasks intelligence integration
        run: |
          rm -f .github/workflows/install-rakiza-ai-tasks.yml
          rm -f scripts/integrate-rakiza-ai-tasks.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Rakiza AI tasks intelligence v0.1'
          git push origin HEAD:main
