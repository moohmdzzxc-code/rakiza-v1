name: Apply Egal Hat fixed choices
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_egal_hat_fixed.py'
      - '.github/workflows/apply-egal-hat-fixed.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/patch_egal_hat_fixed.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add fixed Egal and Hat shortage choices"
          git push origin main
