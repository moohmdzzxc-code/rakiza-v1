name: Apply shortage section cleanup
on:
  push:
    branches: [main]
    paths:
      - 'scripts/clean_shortage_section_options.py'
      - '.github/workflows/apply-shortage-section-cleanup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/clean_shortage_section_options.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/rakiza.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/rakiza.js
          grep -q "shortages-sections-clean-2026-08-25" index.html
          ! grep -q "s.display_order<=10&&s.name!='الزخرفات والري ثوب'" index.html
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Clean shortage section options"
          git push
