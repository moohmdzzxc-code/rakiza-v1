name: Apply Rakiza AI operational language v0.2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_rakiza_ai_language_v02.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/upgrade_rakiza_ai_language_v02.py
      - run: node --check rakiza-ai.js
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('rakiza-ai.js').read_text(encoding='utf-8')
          assert "RAI_VERSION='0.2.0'" in s
          assert 'RAI_OPERATIONAL_CONCEPTS' in s
          assert 'raiDomainScores' in s
          assert 'raiOperation' in s
          assert "sales_analysis" in s
          assert "shortages_query" in s
          assert "readiness_query" in s
          assert "actions_query" in s
          assert "attendance_query" in s
          assert "tasks_query" in s
          assert "operational_summary" in s
          PY
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add rakiza-ai.js
          git diff --cached --quiet || git commit -m "Expand Rakiza AI operational language understanding v0.2"
          git push
