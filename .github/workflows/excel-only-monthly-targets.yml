name: Excel-only monthly targets
on:
  push:
    paths:
      - '.github/workflows/excel-only-monthly-targets.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace monthly target Excel reader with SheetJS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('monthly-targets.js')
          s = p.read_text()
          start = s.find('async function parseExcelFile(file){')
          end = s.find('\n\nfunction buildDraft(found){', start)
          if start == -1 or end == -1:
              raise SystemExit('parseExcelFile block not found')
          new_reader = r'''let sheetJsLoadPromise=null;
function loadSheetJs(){
  if(window.XLSX)return Promise.resolve();
  if(sheetJsLoadPromise)return sheetJsLoadPromise;
  sheetJsLoadPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=()=>window.XLSX?resolve():reject(Error('تعذر تحميل أداة Excel'));
    s.onerror=()=>reject(Error('تعذر تحميل أداة Excel'));
    document.head.appendChild(s);
  });
  return sheetJsLoadPromise;
}

async function parseExcelFile(file){
  await loadSheetJs();
  let wb;
  try{wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true})}
  catch(err){console.error(err);throw Error('تعذر فتح ملف Excel. تأكد أن الملف بصيغة xlsx أو xlsm وغير تالف.')}
  const month=activeMonth(),dmap=dateMaps(month),found=new Map();let headerFound=false;
  for(const sheetName of (wb.SheetNames||[])){
    const ws=wb.Sheets?.[sheetName];if(!ws)continue;
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
    let header=null;
    for(let r=0;r<Math.min(rows.length,60)&&!header;r++){
      const row=Array.isArray(rows[r])?rows[r]:[];let dc=-1,bc=-1,cc=-1;
      for(let c=0;c<Math.min(row.length,30);c++){
        const t=String(row[c]??'').trim();
        if(dc<0&&isDateHeader(t))dc=c;
        if(bc<0&&isBasicHeader(t))bc=c;
        if(cc<0&&isChallengeHeader(t))cc=c;
      }
      if(dc>=0&&bc>=0)header={row:r,dateCol:dc,basicCol:bc,challengeCol:cc};
    }
    if(!header)continue;headerFound=true;
    for(let r=header.row+1;r<rows.length;r++){
      const row=Array.isArray(rows[r])?rows[r]:[];
      const date=parseDisplayDate(row[header.dateCol],month,dmap);if(!date)continue;
      const basic=num(row[header.basicCol]);if(basic===null)continue;
      const challenge=header.challengeCol>=0?num(row[header.challengeCol]):null;
      found.set(date,{basic_target:basic,challenge_target:challenge});
    }
  }
  if(!headerFound)throw Error('لم أجد أعمدة Date و Basic Target داخل ملف Excel');
  if(!found.size)throw Error('لم أجد مستهدفات مطابقة لأيام هذا الشهر داخل الملف');
  return found;
}'''
          s = s[:start] + new_reader + s[end:]
          p.write_text(s)
          PY
      - name: Syntax check
        run: node --check monthly-targets.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly-targets.js
          git diff --cached --quiet || git commit -m "Use SheetJS for monthly target imports"
          git push