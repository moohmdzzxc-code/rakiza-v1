name: Integrate Rakiza AI Reasoning

on:
  push:
    paths:
      - '.github/workflows/install-rakiza-ai-reasoning.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Link shared reasoning layer into Rakiza
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='<script src="rakiza-ai-attendance.js"></script>'
          tag='<script src="rakiza-ai-reasoning.js"></script>'
          if tag not in s:
              if anchor not in s:
                  raise SystemExit('Rakiza AI attendance script anchor not found')
              s=s.replace(anchor,anchor+'\n'+tag,1)
          if s.count(tag)!=1:
              raise SystemExit('Reasoning script must exist exactly once')
          if s.index(tag)<s.index(anchor):
              raise SystemExit('Reasoning layer must load after specialist brains')
          p.write_text(s,encoding='utf-8')

      - name: Syntax checks
        run: |
          node --check rakiza-ai.js
          node --check rakiza-ai-shortages.js
          node --check rakiza-ai-sales.js
          node --check rakiza-ai-readiness.js
          node --check rakiza-ai-attendance.js
          node --check rakiza-ai-reasoning.js
          node --check tests/rakiza-ai-shortages.test.js
          node --check tests/rakiza-ai-sales.test.js
          node --check tests/rakiza-ai-readiness.test.js
          node --check tests/rakiza-ai-attendance.test.js
          node --check tests/rakiza-ai-reasoning.test.js

      - name: Regression tests
        run: |
          node tests/rakiza-ai-shortages.test.js
          node tests/rakiza-ai-sales.test.js
          node tests/rakiza-ai-readiness.test.js
          node tests/rakiza-ai-attendance.test.js
          node tests/rakiza-ai-reasoning.test.js

      - name: Verify integration contract
        shell: python
        run: |
          from pathlib import Path
          r=Path('rakiza-ai-reasoning.js').read_text(encoding='utf-8')
          required=[
            'evidence_first','approved_logic_only','separate_fact_from_inference',
            'open_day_not_zero','movement_not_customers','escalation_not_closure',
            'roster_original_preserved','no_sensitive_write_without_approval',
            'guardClaim','prioritize','actionSafety','recordSpecialist'
          ]
          missing=[x for x in required if x not in r]
          if missing:
              raise SystemExit('Missing reasoning contract: '+', '.join(missing))
          i=Path('index.html').read_text(encoding='utf-8')
          order=['rakiza-ai-shortages.js','rakiza-ai-sales.js','rakiza-ai-readiness.js','rakiza-ai-attendance.js','rakiza-ai-reasoning.js']
          pos=[i.index(x) for x in order]
          if pos!=sorted(pos):
              raise SystemExit('Unexpected AI script order')

      - name: Commit shared reasoning integration
        run: |
          rm -f .github/workflows/install-rakiza-ai-reasoning.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Rakiza AI shared reasoning layer v0.1'
          git push origin HEAD:main
