name: Apply Ihram accessories
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_ihram_accessories.py'
      - '.github/workflows/apply-ihram-accessories.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/add_ihram_accessories.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Ihram to accessories shortages"
          git push
