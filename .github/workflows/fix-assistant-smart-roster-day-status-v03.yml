name: Fix Rakiza smart roster day status v0.3
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_assistant_smart_roster_day_status_v03.py'
      - '.github/workflows/fix-assistant-smart-roster-day-status-v03.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_assistant_smart_roster_day_status_v03.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert "let after=seg.slice(best+bestAlias.length" in s
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip()]
          Path('/tmp/rakiza.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/rakiza.js
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix smart roster day status precedence"
          git push
