name: Apply underwear flow v2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_underwear_flow_v2.py'
      - '.github/workflows/apply-underwear-flow-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_underwear_flow_v2.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/rakiza.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/rakiza.js
          grep -q "underwear-flow-v2-2026-08-25" index.html
          grep -q "'فرزاتشي':{'فنيلة'" index.html
          grep -q "'سروال داخلي'" index.html
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Reorder underwear shortages flow"
          git push
