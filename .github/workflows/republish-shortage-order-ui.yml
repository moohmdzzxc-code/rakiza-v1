name: Republish shortage order UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/republish-shortage-order-ui.yml'
permissions:
  contents: write
jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/republish_shortage_order_ui.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Republish shortage order UI"
          git push origin main
