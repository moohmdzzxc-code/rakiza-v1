name: Apply School smart shortage search
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-school-smart-shortage-search.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/patch_school_smart_shortage_search.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add smart School shortage search"
          git push origin main
