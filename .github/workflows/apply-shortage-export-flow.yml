name: Apply shortage Excel export flow
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_shortage_export_flow.py'
      - '.github/workflows/apply-shortage-export-flow.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_shortage_export_flow.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script><script src="shortage-export.js',s,re.S)
          assert m
          Path('/tmp/rakiza.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/rakiza.js
          node --check shortage-export.js
          grep -q "shortage-excel-export-flow-2026-08-26" index.html
          grep -q "shortExportBtn" index.html
          grep -q "shortage-export.js?v=20260826" index.html
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable shortage Excel export before order"
          git push
