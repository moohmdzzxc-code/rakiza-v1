name: Apply Winter manual style
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_winter_manual_style.py'
      - '.github/workflows/apply-winter-manual-style.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/patch_winter_manual_style.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add smart Winter shortage search"
          git push origin main
