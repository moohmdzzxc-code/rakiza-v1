name: Apply School to Harakat mapping
on:
  pull_request:
    types: [opened]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/patch_school_to_harakat.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Map School shortages to Harakat section"
          git push origin main
