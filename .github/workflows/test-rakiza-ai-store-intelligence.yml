name: Test Rakiza AI Store Intelligence

on:
  push:
    branches:
      - rakiza-ai-store-intelligence-v0-1
    paths:
      - '.github/workflows/test-rakiza-ai-store-intelligence.yml'
      - 'rakiza-ai-store-intelligence.js'
      - 'rakiza-ai-store-reasoning-bridge.js'
      - 'rakiza-ai-reasoning.js'
      - 'rakiza-ai-reasoning-core.js'
      - 'tests/rakiza-ai-store-intelligence.test.js'
      - 'tests/rakiza-ai-store-reasoning.test.js'
      - 'tests/rakiza-ai-reasoning-loader.test.js'
      - 'tests/rakiza-ai-actions-reasoning.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rakiza-ai-store-intelligence-v0-1
      - name: Syntax checks
        run: |
          node --check rakiza-ai.js
          node --check rakiza-ai-shortages.js
          node --check rakiza-ai-sales.js
          node --check rakiza-ai-readiness.js
          node --check rakiza-ai-attendance.js
          node --check rakiza-ai-tasks.js
          node --check rakiza-ai-actions.js
          node --check rakiza-ai-reasoning-core.js
          node --check rakiza-ai-reasoning.js
          node --check rakiza-ai-store-intelligence.js
          node --check rakiza-ai-store-reasoning-bridge.js
          for f in tests/*.test.js; do node --check "$f"; done
      - name: Regression tests
        run: |
          node tests/rakiza-ai-shortages.test.js
          node tests/rakiza-ai-sales.test.js
          node tests/rakiza-ai-readiness.test.js
          node tests/rakiza-ai-attendance.test.js
          node tests/rakiza-ai-reasoning.test.js
          node tests/rakiza-ai-tasks.test.js
          node tests/rakiza-ai-tasks-reasoning.test.js
          node tests/rakiza-ai-actions.test.js
          node tests/rakiza-ai-actions-reasoning.test.js
          node tests/rakiza-ai-store-intelligence.test.js
          node tests/rakiza-ai-store-reasoning.test.js
          node tests/rakiza-ai-reasoning-loader.test.js
