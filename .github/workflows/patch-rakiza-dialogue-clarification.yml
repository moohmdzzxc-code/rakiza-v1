name: Patch Rakiza dialogue clarification flow

on:
  push:
    branches: [rakiza-ai-intent-intelligence-v1b]
    paths: [.github/workflows/patch-rakiza-dialogue-clarification.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dialogue clarification state machine
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rakiza-ai-dialogue.js')
          s=p.read_text()
          anchor="function operationFromReply(n){if(/اعرض|ورني|عطني|استفسار/.test(n))return'query';if(/حلل|تحليل|فسر/.test(n))return'analyze';if(/قارن|مقارنه/.test(n))return'compare';if(/مسود|جهز|سوي|انش/.test(n))return'create';return null}"
          repl=anchor+"\nfunction domainCue(d){return{sales:'المبيعات',shortages:'النواقص',readiness:'الجاهزية',attendance:'خطة التواجد',tasks:'المهام',actions:'الإجراءات والمتابعة',store:'تحليل المعرض'}[d]||d||''}"
          if anchor not in s: raise SystemExit('operationFromReply anchor not found')
          s=s.replace(anchor,repl,1)
          old="""  if(p.stage==='domain'){const d=domainFromReply(n);if(d){const combined=`${p.original} ${text}`;clearPending();record('clarification',text,{resolvedDomain:d});return{reprocess:combined}}if(p.attempts>=3)return'<b>ما زال المجال غير واضح عندي.</b><div class=\"mut\" style=\"margin-top:6px\">اكتب اسم المجال فقط، مثل «المبيعات» أو «خطة التواجد»، وأنا أكمل نفس الطلب بدون ما تعيده.</div>';return optionsHtml('domain')}
  if(p.stage==='operation'){const op=operationFromReply(n);if(op){const combined=`${p.original} ${text}`;clearPending();record('clarification',text,{resolvedOperation:op});return{reprocess:combined}}if(p.attempts>=3)return'<b>ما زال المطلوب نفسه غير واضح.</b><div class=\"mut\" style=\"margin-top:6px\">قل فقط: «اعرض»، «حلل»، «قارن»، أو «جهز مسودة»، وبكمل على نفس الموضوع.</div>';return optionsHtml('operation')}"""
          new="""  if(p.stage==='domain'){const d=domainFromReply(n);if(d){const hist=d==='attendance'?historyDirection(n):null,op=operationFromReply(n);record('clarification',text,{resolvedDomain:d});if(hist){clearPending();return{reprocess:`${hist==='oldest'?'اقدم':'اخر'} خطة تواجد تم تسجيلها`}}if(op){const combined=`${p.original} ${domainCue(d)} ${text}`;clearPending();return{reprocess:combined}}STATE.pending={stage:'operation',original:p.original,attempts:0,domain:d};return optionsHtml('operation')}if(p.attempts>=3)return'<b>ما زال المجال غير واضح عندي.</b><div class=\"mut\" style=\"margin-top:6px\">اكتب اسم المجال فقط، مثل «المبيعات» أو «خطة التواجد»، وأنا أكمل نفس الطلب بدون ما تعيده.</div>';return optionsHtml('domain')}
  if(p.stage==='operation'){if(p.domain==='attendance'){const hist=historyDirection(n);if(hist){clearPending();record('clarification',text,{resolvedOperation:'roster_history',direction:hist});return{reprocess:`${hist==='oldest'?'اقدم':'اخر'} خطة تواجد تم تسجيلها`}}}const op=operationFromReply(n);if(op){const combined=`${p.original} ${domainCue(p.domain)} ${text}`;clearPending();record('clarification',text,{resolvedOperation:op});return{reprocess:combined}}if(p.attempts>=3)return'<b>ما زال المطلوب نفسه غير واضح.</b><div class=\"mut\" style=\"margin-top:6px\">قل فقط: «اعرض»، «حلل»، «قارن»، أو «جهز مسودة»، وبكمل على نفس الموضوع.</div>';return optionsHtml('operation')}"""
          if old not in s: raise SystemExit('pending stages target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Syntax check
        run: node --check rakiza-ai-dialogue.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rakiza-ai-dialogue.js
          git commit -m "Keep Rakiza clarification conversational across missing slots"
          git push
