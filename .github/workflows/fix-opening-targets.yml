name: Fix opening target metrics
on:
  push:
    paths:
      - '.github/workflows/fix-opening-targets.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove target metrics from opening screen
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<div class="metric"><span class="mut">مستهدف الشهر</span><strong id="quickMonthTarget">—</strong></div>', '')
          s = s.replace('<div class="metric"><span class="mut">نسبة المحقق من الشهر</span><strong id="quickMonthAch">—</strong></div>', '')
          s = s.replace('<script src="monthly-targets.js"></script>', '<script src="monthly-targets.js?v=opening-cleanup-20260915"></script>')
          if 'opening-target-cleanup' not in s:
              cleanup = '''<script id="opening-target-cleanup">\n(function(){\n  function clean(){\n    ['quickMonthTarget','quickMonthAch','quickDailyTarget','monthlyTargetCard'].forEach(function(id){\n      var el=document.getElementById(id);\n      if(!el)return;\n      var node=(id==='monthlyTargetCard')?el:el.closest('.metric');\n      if(node)node.remove();\n    });\n  }\n  clean();\n  document.addEventListener('DOMContentLoaded',clean);\n  var n=0,t=setInterval(function(){clean();if(++n>20)clearInterval(t)},250);\n})();\n</script>'''
              s = s.replace('</body>', cleanup + '\n</body>')
          p.write_text(s)

          p = Path('monthly-targets.js')
          s = p.read_text()
          s = s.replace("  const firstMetrics=opening.querySelector('.card .metrics');\n  if(firstMetrics&&!tf$('quickDailyTarget'))firstMetrics.insertAdjacentHTML('beforeend','<div class=\"metric\"><span class=\"mut\">مستهدف اليوم</span><strong id=\"quickDailyTarget\">—</strong></div>');\n", '')
          p.write_text(s)
          PY
      - name: Verify cleanup
        run: |
          ! grep -q 'id="quickMonthTarget"' index.html
          ! grep -q 'id="quickMonthAch"' index.html
          ! grep -q 'id="quickDailyTarget"' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html monthly-targets.js
          git diff --cached --quiet || git commit -m "Remove sales targets from opening screen"
          git push