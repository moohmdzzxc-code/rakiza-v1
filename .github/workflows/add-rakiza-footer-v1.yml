name: Add Rakiza copyright footer
on:
  push:
    paths:
      - '.github/workflows/add-rakiza-footer-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add static footer to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = 'id="rakizaCopyright"'
          if marker not in s:
              footer = '<footer id="rakizaCopyright" dir="rtl" style="max-width:1200px;margin:18px auto 8px;padding:14px 18px;text-align:center;color:#667085;font-size:13px;line-height:1.8;">© 2026 ركيزة — عمل وإنتاج محمد الضمري — جميع الحقوق محفوظة</footer>\n'
              s = s.replace('</body>', footer + '</body>')
              p.write_text(s)
          PY
      - name: Verify footer
        run: |
          grep -q 'id="rakizaCopyright"' index.html
          grep -q 'عمل وإنتاج محمد الضمري' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add static Rakiza copyright footer"
          git push
