name: Test Rakiza conversational voice v1

on:
  push:
    branches:
      - rakiza-ai-conversational-voice-v1
    paths:
      - .github/workflows/test-rakiza-conversational-voice-v1b.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration patch
        run: python scripts/patch_voice_integration.py
      - name: Syntax check
        run: |
          set -e
          for f in rakiza-ai*.js; do node --check "$f"; done
          for f in tests/*.test.js; do node --check "$f"; done
      - name: Run full regression
        run: |
          set -e
          for f in tests/*.test.js; do
            echo "=== $f ==="
            node "$f"
          done
      - name: Commit tested integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rakiza-ai-conversation-universal.js rakiza-ai-dialogue.js rakiza-ai-conversation.js rakiza-ai-reasoning.js tests/rakiza-ai-reasoning-loader.test.js
          git commit -m "Integrate conversational voice across Rakiza AI"
          git push
