name: Apply Rakiza assistant roster v0.2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_assistant_roster_v02.py'
      - '.github/workflows/apply-assistant-roster-v02.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/add_assistant_roster_v02.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'assistant-v02-roster-2026-09-09' in s
          assert 'assistantGenerateRosterNextWeek' in s
          assert 'assistantApproveRosterDraft' in s
          assert 'إنشاء خطة تواجد' in s
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip()]
          Path('/tmp/rakiza.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/rakiza.js
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add assistant roster planning task v0.2"
          git push
