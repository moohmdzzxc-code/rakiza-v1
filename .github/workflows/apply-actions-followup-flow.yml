name: Apply actions follow-up flow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-actions-followup-flow.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/patch_actions_followup_flow.py
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild actions follow-up flow"
          git push origin main
