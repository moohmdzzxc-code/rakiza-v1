name: Refine Rakiza AI Shortages Language

on:
  push:
    paths:
      - '.github/workflows/refine-rakiza-ai-shortages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine language and context handling
        shell: python
        run: |
          from pathlib import Path
          p=Path('rakiza-ai-shortages.js')
          s=p.read_text(encoding='utf-8')
          reps=[
            ("const RSI_VERSION='0.1.0';","const RSI_VERSION='0.1.1';"),
            ("else if(/كم لها|من متى|منذ|مدة|مده|صار له|صار لها/.test(n))spec.metric='age';",
             "else if(/كم لها|كم له|من متى|من يوم متى|منذ|مدة|مده|صار له|صار لها|كم جلس|كم قعد|له كم يوم|لها كم يوم|لين وصل|حتى وصل|ننتظر.*تغذ/.test(n))spec.metric='age';"),
            ("if(/بانتظار.*تصدير|ما.*صدر|مفتوح.*اكسل/.test(n)){spec.status='pending_export';spec.dateField='first_detected_date'}",
             "if(/بانتظار.*تصدير|بانتظار.*اكسل|ما.*صدر|مفتوح.*اكسل/.test(n)){spec.status='pending_export';spec.dateField='first_detected_date'}"),
            ("else if(/صدرت.*ما.*طلب|مصدّر|مصدر.*بانتظار|بانتظار.*طلب/.test(n)){spec.status='exported_waiting_order';spec.dateField='first_detected_date'}",
             "else if(/صدرت.*ما.*طلب|صدرنا.*ما.*طلب|مصدر.*ما.*طلب|مصدّر|مصدر.*بانتظار|بانتظار.*طلب|تصدير.*بانتظار.*طلب/.test(n)){spec.status='exported_waiting_order';spec.dateField='first_detected_date'}"),
            ("  if(spec.focus?.type==='section')out=out.filter(r=>norm(rowSection(r))===norm(spec.focus.key));\n  const prod=detectStrongProduct(text,out,spec);",
             "  if(spec.focus?.type==='section')out=out.filter(r=>norm(rowSection(r))===norm(spec.focus.key));\n  if(spec.focus?.type==='item'&&spec.focus?.section)out=out.filter(r=>norm(rowSection(r))===norm(spec.focus.section));\n  const prod=detectStrongProduct(text,out,spec);"),
          ]
          for old,new in reps:
            if old not in s:
              raise SystemExit('Patch target not found: '+old[:100])
            s=s.replace(old,new,1)

          old="""function aggregate(rows,groupBy,metric){
  const m=new Map();
  for(const r of rows){
    const key=groupBy==='section'?rowSection(r):groupBy==='status'?displayStatus(r):itemLabel(r),id=norm(key);
    if(!m.has(id))m.set(id,{key,label:key,count:0,lost:0,requested:0,current:0,rows:[]});
    const x=m.get(id);x.count++;x.lost+=num(r.lost_opportunities);x.requested+=num(r.requested_qty);x.current+=num(r.current_qty);x.rows.push(r);
  }
"""
          new="""function aggregate(rows,groupBy,metric){
  const m=new Map(),oneSection=new Set(rows.map(rowSection)).size===1;
  for(const r of rows){
    const raw=groupBy==='section'?rowSection(r):groupBy==='status'?displayStatus(r):itemLabel(r);
    const key=groupBy==='item'?rowKey(r):raw,id=norm(key),label=groupBy==='item'?(oneSection?itemLabel(r):`${rowSection(r)} — ${itemLabel(r)}`):raw;
    if(!m.has(id))m.set(id,{key,label,count:0,lost:0,requested:0,current:0,rows:[]});
    const x=m.get(id);x.count++;x.lost+=num(r.lost_opportunities);x.requested+=num(r.requested_qty);x.current+=num(r.current_qty);x.rows.push(r);
  }
"""
          if old not in s: raise SystemExit('aggregate patch target not found')
          s=s.replace(old,new,1)

          old="""  return{html:h,focus:show[0]?{type:spec.groupBy==='section'?'section':'item',key:show[0].label,label:show[0].label}:null};
}"""
          new="""  let focus=null;
  if(show[0]){
    if(spec.groupBy==='section')focus={type:'section',key:show[0].label,label:show[0].label};
    else if(show[0].rows?.[0])focus={type:'item',key:itemLabel(show[0].rows[0]),label:itemLabel(show[0].rows[0]),section:rowSection(show[0].rows[0])};
  }
  return{html:h,focus};
}"""
          if old not in s: raise SystemExit('focus patch target not found')
          s=s.replace(old,new,1)

          old="""    const active=rows.filter(r=>!['supplied','closed'].includes(statusKind(r))),show=(active.length?active:rows).slice().sort((a,b)=>String(a.first_detected_date||'').localeCompare(String(b.first_detected_date||''))).slice(0,10),today=baseDate();
    return `<b>مدة النقص</b><div style=\"margin-top:9px\">${show.map(r=>`${esc(rowSection(r))} — <b>${esc(itemLabel(r))}</b>: ${fmt(daysBetween(r.first_detected_date,today))} يوم منذ أول رصد (${esc(r.first_detected_date||'—')})`).join('<br>')}</div>`;
"""
          new="""    const active=rows.filter(r=>!['supplied','closed'].includes(statusKind(r))),show=(active.length?active:rows).slice().sort((a,b)=>String(a.first_detected_date||'').localeCompare(String(b.first_detected_date||''))).slice(0,10),today=baseDate();
    return `<b>مدة النقص</b><div style=\"margin-top:9px\">${show.map(r=>{const done=['supplied','closed'].includes(statusKind(r)),end=done?(r.supplied_date||r.ordered_date||today):today,label=done?'حتى التغذية/الإغلاق':'حتى اليوم';return `${esc(rowSection(r))} — <b>${esc(itemLabel(r))}</b>: ${fmt(daysBetween(r.first_detected_date,end))} يوم ${label} (أول رصد ${esc(r.first_detected_date||'—')})`}).join('<br>')}</div>`;
"""
          if old not in s: raise SystemExit('age patch target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

      - name: Syntax check
        run: node --check rakiza-ai-shortages.js

      - name: Language intent tests
        run: |
          node <<'NODE'
          global.window={RakizaAI:{}};
          global.app={calendarDate:'2026-09-13',date:'2026-09-13',sections:[
            {id:'1',name:'الفاخر'},{id:'2',name:'الأعمال'},{id:'3',name:'الداخليات'},{id:'4',name:'الأشمغة'}
          ]};
          global.document={};
          require('./rakiza-ai-shortages.js');
          const S=window.RakizaAI.shortages;
          const cases=[
            ['وش أكثر صنف يتكرر نقصه؟',x=>x.task==='rank'&&x.metric==='recurrence'&&x.groupBy==='item'],
            ['أي قسم خسرنا فيه فرص أكثر؟',x=>x.task==='rank'&&x.metric==='lost'&&x.groupBy==='section'],
            ['كم فرصة ضاعت من الفاخر هذا الشهر؟',x=>x.task==='metric'&&x.metric==='lost'&&x.section==='الفاخر'&&x.period?.type==='month'],
            ['وش طلبناه وما وصل للحين؟',x=>x.status==='ordered'],
            ['وش عندنا بانتظار الاكسل؟',x=>x.status==='pending_export'],
            ['وش صدرنا ولسه ما طلبنا؟',x=>x.status==='exported_waiting_order'],
            ['كم له يوم ناقص؟',x=>x.task==='metric'&&x.metric==='age'],
            ['وش تكرر بعد ما وصل قبل؟',x=>x.task==='rank'&&x.metric==='recur_after_supply'],
            ['قارن اغسطس بسبتمبر في النواقص',x=>x.task==='compare'&&x.period?.type==='compare'],
            ['كم طلبنا من الاعمال الشهر الماضي؟',x=>x.metric==='requested'&&x.section==='الأعمال'&&x.status==='ordered'],
          ];
          for(const [q,test] of cases){const x=S.detectSpec(q,{});if(!test(x)){console.error('FAILED',q,x);process.exit(1)}else console.log('OK',q)}
          if(S.detectSection('وش ناقص في الفاخر')!=='الفاخر')process.exit(1);
          if(S.detectSection('نواقص business')!=='الأعمال')process.exit(1);
          console.log('All shortage language tests passed');
          NODE

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/refine-rakiza-ai-shortages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rakiza-ai-shortages.js .github/workflows/refine-rakiza-ai-shortages.yml
          git commit -m 'Refine Rakiza AI shortage language and context'
          git push origin HEAD:main
