name: Apply underwear long pants alpha removal
on:
  push:
    branches: [main]
    paths:
      - 'scripts/remove_underwear_longpants_alpha_sizes.py'
      - '.github/workflows/apply-underwear-longpants-alpha-removal.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/remove_underwear_longpants_alpha_sizes.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/rakiza.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/rakiza.js
          grep -q "'سروال طويل':\['18K','18K-XXL','20K','20K-XXL','20R','22K','22R','24K','24R','26K','26R','28K','28R','30K','30K-XXL'\]" index.html
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove standalone alpha sizes from men long pants"
          git push
