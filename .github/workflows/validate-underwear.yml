name: Validate underwear frontend
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-underwear.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m, 'script block not found'
          Path('/tmp/rakiza.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/rakiza.js
          grep -q "shortUnderwearBox" index.html
          grep -q "function saveUwShortages" index.html
          grep -q "'فرزاتشي'" index.html
          grep -q "Youth:\['30K','30R','32K','32R','34K','34R','36K','36R','38K','38R'\]" index.html
