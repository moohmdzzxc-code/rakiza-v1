name: Rollback underwear long pants
on:
  push:
    branches: [main]
    paths:
      - 'scripts/rollback_underwear_longpants_sizes.py'
      - '.github/workflows/rollback-underwear-longpants.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/rollback_underwear_longpants_sizes.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/rakiza.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/rakiza.js
      - run: |
          git config user.name "Rakiza Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Rollback long pants size cleanup"
          git push
